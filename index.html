<html>
    <head>
        <link rel="stylesheet" href="index.css">
        <link href="https://fonts.cdnfonts.com/css/cursed-timer-ulil" rel="stylesheet">
    </head>
    <body>
        <div class="container">
            <div>
                <h3>HOME</h3>
                <p id="home-score" class="score">0</p>
                <button onclick="addOneHome()">+1</button>
                <button onclick="addTwoHome()">+2</button>
                <button onclick="addThreeHome()">+3</button>
                <button onclick="saveHome()" class="save-btn">SAVE</button>
                <p id="home-saved" class="saved-score">Saved scores: </p>
            </div>
            <div>
                <h3>GUEST</h3>
                <p id="guest-score" class="score">0</p>
                <button onclick="addOneGuest()">+1</button>
                <button onclick="addTwoGuest()">+2</button>
                <button onclick="addThreeGuest()">+3</button>
                <button onclick="saveGuest()" class="save-btn">SAVE</button>
                <p id="guest-saved" class="saved-score">Saved scores: </p>
            </div>
        </div>
        <script src="index.js"></script>
    </body>
</html>
